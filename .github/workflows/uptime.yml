name: Uptime check

# A lightweight safety net, added 2026-08-27 (back-ported from the presacademy
# repo): every hour, confirm the live site's key pages return HTTP 200. A failed
# run notifies you through GitHub.
#
# The schedule is ENABLED. This repo is PUBLIC, so Actions minutes are free.
#
# The SITE_URL repo variable overrides the origin; without it the job uses the
# live workers.dev origin baked in below. Set the variable at the domain cutover
# (see site/docs/LAUNCH_CHECKLIST.md) rather than editing this file.
#
# It used to WARN and exit 0 when the variable was missing. Nobody ever set the
# variable, so the job passed hourly without making a single request — see the
# note on the fallback below.
#
# WARNING: keep the TRAILING SLASH on each path. This is a static build with
# directory-format output, so /tuition answers 307 and only /tuition/ answers
# 200 (site/CLAUDE.md -> Gotchas -> "Trailing slash").
#
# Note: GitHub's scheduler is best-effort and can be delayed under load. For
# real monitoring, also point a dedicated service (UptimeRobot's free tier is
# enough) at the homepage.
on:
  schedule:
    - cron: '17 * * * *' # hourly, offset off the top of the hour
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check key pages return 200
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          # Falls back to the live origin rather than skipping. The old version
          # warned and exited 0 when SITE_URL was unset — and it was never set,
          # so from 2026-08-27 to 2026-09-07 this job reported success every
          # hour while checking nothing at all. A green tick for "did not run"
          # is worse than no job, because it is indistinguishable from "passed".
          base="${SITE_URL:-https://wcp-website.nathanjnixon86.workers.dev}"
          base="${base%/}"
          echo "checking ${base}"
          fail=0
          for path in "/" "/tuition/" "/enroll/" "/faq/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "${base}${path}")
            echo "${code}  ${base}${path}"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            echo "::error::One or more key pages did not return HTTP 200."
            exit 1
          fi

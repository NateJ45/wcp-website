name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  # Manual runs exist for one reason: the baselines bot commits with the
  # default GITHUB_TOKEN, whose pushes never trigger workflows — so after a
  # baseline regeneration, dispatch CI by hand to validate against the new
  # truth images.
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both (private-repo Actions minutes are metered).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The deployable app lives in site/ ; run every step there.
defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Sanity typegen guard (added 2026-08-27). `src/lib/sanity.types.ts` is
      # generated from the Studio schema and committed by hand. Regenerate it
      # here: any diff means someone changed a schema type and did not re-run
      # typegen, so the committed types no longer describe the real content.
      # NODE_OPTIONS raises the heap for this step only. `sanity schema extract`
      # bundles the whole Studio config and its import graph, and on 2026-08-28
      # it began aborting with a core dump on the runner (exit 134) while the
      # same command succeeded locally - the classic signature of a Linux CI box
      # with less memory than the dev machine. The preview layer that landed
      # that day added to the config's graph and pushed it over.
      # `sanity schema extract` intermittently dies with "Aborted (core
      # dumped)" (exit 134) on the hosted runners — twice on 2026-09-03 alone,
      # both times passing on a plain re-run. It is runner flake, not a
      # schema problem, so retry up to three times before calling it red.
      - name: Generate Sanity types
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          for attempt in 1 2 3; do
            if npm run typegen; then exit 0; fi
            echo "::warning::typegen attempt $attempt failed (runner flake?) - retrying"
            sleep 15
          done
          echo "::error::typegen failed three times"
          exit 1

      - name: Fail if committed Sanity types are stale
        run: |
          if ! git diff --quiet -- src/lib/sanity.types.ts; then
            echo "::error::src/lib/sanity.types.ts is out of date. Run 'npm run typegen' in site/ and commit the result."
            git --no-pager diff -- src/lib/sanity.types.ts
            exit 1
          fi

      - name: Type check (astro check)
        run: npx astro check

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      # Pure-function unit tests (Vitest): hub date math + Portable Text
      # heading normalization. Hermetic — no browser, no Sanity token.
      - name: Unit tests (vitest)
        run: npm run test:unit

      # Pages are now CMS-driven: [...slug].astro's getStaticPaths() reads the
      # page documents from Sanity at build time, so the build needs a read
      # token to emit any pages (without it the site builds empty and the link
      # check below sees only a broken root). Same secret the Deploy job uses.
      - name: Build
        run: npm run build
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}

      - name: Check internal links
        run: npm run check:links

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Both projects from playwright.config.ts: chromium (desktop) AND
      # webkit-iphone. Installing only chromium made every webkit test die
      # with "Executable doesn't exist" (bit us 2026-07-13).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Runs the reflow (320px), smoke, and axe accessibility suites against a
      # fresh production build (see playwright.config.ts webServer). That
      # webServer runs `npm run build`, which reads the CMS page docs from
      # Sanity — so the token has to be present here too, or the build serves
      # an empty site and the webServer health check times out.
      - name: Run tests (reflow · smoke · a11y)
        run: npm test
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}

      # Pixel-diffs /styleguide (light + dark) against the committed Linux
      # baselines. Reuses the dist the step above built (reuseExistingServer
      # is CI-disabled, so this rebuilds — the token stays required). A red
      # diff means the design system moved: look at the diff artifact; if
      # the change is INTENDED, dispatch update-visual-baselines.yml.
      - name: Visual regression (styleguide)
        id: visual
        run: npm run test:visual
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}

      # Reports the visual step's pass/fail to the studio-status dashboard so
      # it can show one line per site: "visual regression: pass/fail" plus a
      # thumbnail of the last diff. Runs after a pass OR a fail (if: always).
      # Never fails the job: a curl error, or a missing
      # STUDIO_STATUS_INGEST_TOKEN secret, only skips the report. On a failed
      # visual step, Playwright writes an expected/actual/diff PNG triplet per
      # broken screenshot under site/test-results/ (the same folder the
      # visual-diffs artifact below uploads) — only the *-diff.png files go
      # to the dashboard, capped at six, downscaled to 800px wide with
      # ImageMagick when the runner has it (ubuntu-latest does).
      - name: Report visual regression to studio-status
        if: always()
        env:
          STUDIO_STATUS_INGEST_TOKEN: ${{ secrets.STUDIO_STATUS_INGEST_TOKEN }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set +e

          if [ -z "$STUDIO_STATUS_INGEST_TOKEN" ]; then
            echo "STUDIO_STATUS_INGEST_TOKEN is not set. Skipping the dashboard report."
            exit 0
          fi

          # if: always() also fires when an EARLIER step broke and the visual
          # step never ran (outcome "skipped"/"cancelled"). That is not a
          # visual failure; report nothing rather than a false red.
          if [ "$VISUAL_OUTCOME" != "success" ] && [ "$VISUAL_OUTCOME" != "failure" ]; then
            echo "Visual step outcome is '$VISUAL_OUTCOME' (did not run). Skipping the dashboard report."
            exit 0
          fi

          BASE_URL="https://studio-status.nathanjnixon86.workers.dev"
          SHA7="${COMMIT_SHA:0:7}"
          STATUS="fail"
          if [ "$VISUAL_OUTCOME" = "success" ]; then
            STATUS="pass"
          fi

          # Playwright's diff files: <testname>-diff.png inside test-results/.
          DIFF_FILES=$(find test-results -type f -name "*-diff.png" 2>/dev/null | sort | head -n 6)

          DIFF_NAMES_JSON="[]"
          if [ -n "$DIFF_FILES" ]; then
            NAMES_JSON="["
            FIRST=1
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              BASENAME=$(basename "$FILE")
              UPLOAD_FILE="$FILE"

              # Downscale to max width 800px so the dashboard thumbnail stays
              # small. A failed resize falls back to the original file.
              if command -v convert >/dev/null 2>&1; then
                RESIZED="/tmp/${BASENAME}"
                if convert "$FILE" -resize 800x\> "$RESIZED" 2>/dev/null; then
                  UPLOAD_FILE="$RESIZED"
                fi
              fi

              curl --fail-with-body -sS \
                -X PUT "$BASE_URL/ingest/visual/wcp/$BASENAME" \
                -H "Authorization: Bearer $STUDIO_STATUS_INGEST_TOKEN" \
                -H "Content-Type: image/png" \
                --data-binary "@$UPLOAD_FILE" \
                || echo "::warning::upload of $BASENAME to studio-status failed - dashboard ingest skipped"

              if [ "$FIRST" -eq 1 ]; then
                FIRST=0
              else
                NAMES_JSON="${NAMES_JSON},"
              fi
              NAMES_JSON="${NAMES_JSON}\"${BASENAME}\""
            done <<< "$DIFF_FILES"
            DIFF_NAMES_JSON="${NAMES_JSON}]"
          fi

          PAYLOAD=$(cat <<EOF
          { "status": "$STATUS", "runId": "$RUN_ID", "runUrl": "$RUN_URL", "commit": "$SHA7", "diffs": $DIFF_NAMES_JSON }
          EOF
          )

          curl --fail-with-body -sS \
            -X POST "$BASE_URL/ingest/visual/wcp" \
            -H "Authorization: Bearer $STUDIO_STATUS_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            || echo "::warning::studio-status summary POST failed - dashboard ingest skipped"

          exit 0

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: visual-diffs
          path: site/test-results/
          retention-days: 14
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both (private-repo Actions minutes are metered).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The deployable app lives in site/ ; run every step there.
defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npx astro check

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      # Pure-function unit tests (Vitest): hub date math + Portable Text
      # heading normalization. Hermetic — no browser, no Sanity token.
      - name: Unit tests (vitest)
        run: npm run test:unit

      # Pages are now CMS-driven: [...slug].astro's getStaticPaths() reads the
      # page documents from Sanity at build time, so the build needs a read
      # token to emit any pages (without it the site builds empty and the link
      # check below sees only a broken root). Same secret the Deploy job uses.
      - name: Build
        run: npm run build
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}

      - name: Check internal links
        run: npm run check:links

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Runs the reflow (320px), smoke, and axe accessibility suites against a
      # fresh production build (see playwright.config.ts webServer). That
      # webServer runs `npm run build`, which reads the CMS page docs from
      # Sanity — so the token has to be present here too, or the build serves
      # an empty site and the webServer health check times out.
      - name: Run tests (reflow · smoke · a11y)
        run: npm test
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 14

name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both (private-repo Actions minutes are metered).
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Needs the Sanity read token: pages are CMS-driven now, so without it
      # the build emits an empty site and lhci audits nothing (or a 404 root).
      - name: Build
        run: npm run build
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}

      # Accessibility is a hard gate (minScore 1) in lighthouserc.json;
      # performance / best-practices / SEO are warnings.
      - name: Lighthouse CI
        run: npx lhci autorun

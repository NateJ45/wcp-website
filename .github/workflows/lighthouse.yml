name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: site

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Accessibility is a hard gate (minScore 1) in lighthouserc.json;
      # performance / best-practices / SEO are warnings.
      - name: Lighthouse CI
        run: npx lhci autorun

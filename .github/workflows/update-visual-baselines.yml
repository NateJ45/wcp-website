# =============================================================================
# Regenerate the visual-regression baselines (MANUAL, deliberate)
# =============================================================================
# Baselines are platform-sensitive, so they are generated HERE (the same
# Linux runners CI diffs on) and committed. Run this workflow only when a
# visual change is INTENDED: it overwrites the truth the visual suite checks
# against, so running it to silence a red diff is how regressions get
# ratified. Look at the diff artifact on the failing run first.
# =============================================================================
name: Update visual baselines

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # `--with-deps` runs `apt-get update`, which fails outright when the
        # runner's third-party Chrome/Microsoft apt sources are mid-sync and
        # report a "Hash Sum mismatch" (that killed a deploy 2026-09-09).
        # Playwright's system libraries come from Ubuntu's own archive, so drop
        # those sources first, then retry once for transient network failures.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/microsoft*
          npx playwright install --with-deps chromium ||
            npx playwright install --with-deps chromium

      - name: Regenerate baselines
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: npm run test:visual -- --update-snapshots

      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "Visual baselines regenerated (CI runners)"
            git push
          fi

name: Sanity dataset backup

# Nightly export of the production Sanity dataset (documents + assets), added
# 2026-08-27 (back-ported from the presacademy repo). The whole site lives in
# Sanity: a bad mutation, a mis-run patch script, or an accidental "Remove
# field" in the Studio can destroy content that no code change can restore.
# This job makes every night recoverable.
#
# The schedule is ENABLED. This repo is PUBLIC, so Actions minutes are free.
#
# The gate job below checks that the SANITY_TOKEN and BACKUP_PASSPHRASE
# secrets exist. A missing secret gives a WARNING and skips the export; it
# never fails the run. That keeps a red X off the Actions tab if a secret is
# ever rotated out.
#
# WARNING: the export is ENCRYPTED before upload, and that is load-bearing.
# This repo is PUBLIC, so any logged-in GitHub user can download artifacts.
# The dataset holds the family directory, health details, and the
# share-by-link Google URLs. A plaintext artifact publishes all of it
# (found 2026-09-01; the old plaintext artifacts were deleted). Never
# upload the tarball without the openssl step.
#
# Restore: download the artifact, then from site/ run
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
#     -in sanity-backup-<date>.tar.gz.enc -out sanity-backup.tar.gz \
#     -pass env:BACKUP_PASSPHRASE
#   npx sanity dataset import sanity-backup.tar.gz production --replace
# The passphrase lives in the school records and in site/.dev.vars.
# See site/docs/SANITY.md -> "Nightly dataset backup".
on:
  schedule:
    - cron: '0 7 * * *' # daily 07:00 UTC (03:00 Eastern)
  workflow_dispatch:

jobs:
  # WARNING: do NOT hoist `defaults.run.working-directory: site` to the workflow
  # level. This job never checks out the repo, so site/ would not exist and
  # every step would fail before it could warn. The export job sets it itself.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.SANITY_TOKEN }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SANITY_TOKEN not set; skipping backup. See site/docs/SANITY.md."
          elif [ -z "$PASSPHRASE" ]; then
            # No passphrase means the artifact would upload as PLAINTEXT on a
            # public repo. Refuse to export at all rather than leak the
            # directory — see the header warning.
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BACKUP_PASSPHRASE not set; skipping backup so the dataset never uploads unencrypted. See site/docs/SANITY.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  export:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # The deployable app (and sanity.cli.ts, which carries the project id) lives
    # in site/ ; run every step there.
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Sanity CLI reads its credentials from SANITY_AUTH_TOKEN. The repo
      # secret is named SANITY_TOKEN (the name the build workflows already
      # use), so map it here. projectId and dataset come from sanity.cli.ts,
      # which is why this step must run in site/.
      - name: Export production dataset
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          npx sanity dataset export production "sanity-backup-$STAMP.tar.gz"

      # Encrypt BEFORE upload — see the header warning. AES-256-CBC with a
      # PBKDF2-stretched passphrase; openssl ships on every runner and every
      # laptop a restore would happen on.
      - name: Encrypt the export
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          for f in sanity-backup-*.tar.gz; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -in "$f" -out "$f.enc" -pass env:BACKUP_PASSPHRASE
            rm "$f"
          done
          ls -lh sanity-backup-*.tar.gz.enc

      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: sanity-backup
          path: site/sanity-backup-*.tar.gz.enc
          # GitHub keeps artifacts 90 days. For longer or off-site retention,
          # push the tarball to R2 here instead.
          retention-days: 90

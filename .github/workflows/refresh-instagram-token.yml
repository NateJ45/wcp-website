name: Refresh Instagram token

# Instagram's long-lived Graph API token (INSTAGRAM_TOKEN) is valid ~60 days
# and can be extended for another 60 by calling Meta's refresh endpoint any
# time after it's 24h old. This keeps it perpetually fresh so the live feed
# in InstagramSection never silently falls back to the curated album.
#
# GitHub Actions cron is calendar-based (fixed times/dates), not
# interval-based, so it cannot express "every 50 days" directly. Instead this
# runs on a frequent-enough cron and gates the actual refresh behind a
# timestamp kept on the `ops-state` branch (instagram-token-refreshed-at) — the refresh
# only fires once >= 50 days have actually elapsed since the last one, giving
# an exact 50-day cadence independent of how the cron itself is expressed.
# Comfortably inside the 60-day expiry window even if a run is skipped
# (GitHub can delay/drop scheduled runs during high load).
#
# The same token value has to land in TWO places, since the public site and
# the Family Hub read it through different mechanisms (see env.d.ts): the
# GitHub Actions secret (build-time INSTAGRAM_TOKEN for the static build) and
# the Cloudflare Worker secret of the same name (SSR runtime, for the hub's
# SocialWallWidget). Both are updated below.
on:
  schedule:
    - cron: '0 13 * * 1' # every Monday 13:00 UTC — the gate below decides if it actually acts
  workflow_dispatch: # manual "run now" from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The marker lives on the unprotected `ops-state` branch, NOT on main.
      # `main` is governed by the ruleset "main: PR + green CI", and a repo owned
      # by a personal account cannot grant the GitHub Actions app a bypass (the
      # API rejects actor_type "Integration" outright), so a cron that committed
      # to main would fail every time it was due. Reading and writing a branch
      # nothing protects keeps this job self-sufficient with no bypass anywhere.
      - name: Check if 50 days have elapsed
        id: check
        run: |
          # LAST=0 means "never refreshed", which makes DAYS_SINCE enormous and
          # fires the gate below. That safe default is deliberate and unchanged
          # from when this marker lived on main: a missing marker must refresh,
          # never skip. A missing ops-state branch lands in the same place.
          LAST=0
          if git fetch --depth=1 origin ops-state 2>/dev/null; then
            LAST=$(git show FETCH_HEAD:instagram-token-refreshed-at 2>/dev/null || echo 0)
          fi
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac
          NOW=$(date +%s)
          DAYS_SINCE=$(( (NOW - LAST) / 86400 ))
          echo "$DAYS_SINCE days since last refresh (0 = never)"
          if [ "$DAYS_SINCE" -ge 50 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      # graph.instagram.com/refresh_access_token exchanges a still-valid
      # long-lived token for a new 60-day one. Requires INSTAGRAM_TOKEN itself
      # (read-only use — this step never writes it).
      - name: Refresh long-lived token
        if: steps.check.outputs.due == 'true'
        id: refresh
        run: |
          RESPONSE=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${{ secrets.INSTAGRAM_TOKEN }}")
          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // empty')
          if [ -z "$NEW_TOKEN" ]; then
            echo "::error::Instagram token refresh failed: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$NEW_TOKEN"
          echo "new_token=$NEW_TOKEN" >> "$GITHUB_OUTPUT"

      # The default GITHUB_TOKEN cannot write repo Actions secrets or trigger
      # other workflows (events it creates don't cascade — GitHub's
      # anti-recursion rule). Both steps below need a real PAT with the repo's
      # "Secrets: write" and "Actions: write" permissions, stored as
      # GH_ACTIONS_PAT. See site/docs/PAGE_BUILDER.md for setup.
      - name: Store the refreshed token (GitHub Actions secret)
        if: steps.check.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set INSTAGRAM_TOKEN --body "${{ steps.refresh.outputs.new_token }}"

      # Same token, pushed to the Worker so the SSR Family Hub picks it up too
      # — import.meta.env (the build-time secret above) isn't visible at
      # request time. wrangler resolves the target Worker from wrangler.jsonc's
      # "name" field, so no build/deploy config is needed for a secret write.
      - uses: actions/setup-node@v7
        if: steps.check.outputs.due == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.due == 'true'
        working-directory: site
        run: npm ci

      - name: Store the refreshed token (Cloudflare Worker secret)
        if: steps.check.outputs.due == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "${{ steps.refresh.outputs.new_token }}" | npx wrangler secret put INSTAGRAM_TOKEN

      - name: Record refresh timestamp
        if: steps.check.outputs.due == 'true'
        run: |
          # Commit the new timestamp ONTO ops-state without checking it out:
          # hash-object / write-tree / commit-tree build the one-file commit
          # directly, so the main checkout this job is running in is never
          # disturbed and no second worktree is needed. commit-tree still needs
          # a committer identity, hence the git config lines.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin ops-state
          PARENT=$(git rev-parse FETCH_HEAD)
          BLOB=$(date +%s | git hash-object -w --stdin)
          # Build the one-file tree through a THROWAWAY index. The obvious
          # `printf ... | git mktree` needs a literal tab between the mode and
          # the path, and an invisible tab inside a YAML block scalar is a
          # trap; --cacheinfo takes the same fields as plain arguments.
          GIT_INDEX_FILE=$(mktemp -u)   # -u: a NAME only. A zero-byte file from
          #                               plain mktemp makes git abort with
          #                               "index file smaller than expected".
          export GIT_INDEX_FILE
          git update-index --add --cacheinfo 100644,$BLOB,instagram-token-refreshed-at
          TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "chore: record Instagram token refresh")
          git push origin "$COMMIT:refs/heads/ops-state"

      # Rebuilds so the new token is baked into the static build immediately,
      # rather than waiting for the next content push or Sanity publish.
      - name: Trigger a rebuild
        if: steps.check.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh workflow run deploy.yml --ref main

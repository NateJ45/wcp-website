name: Deploy

# Two triggers:
#  - push to main: code changes go live automatically.
#  - repository_dispatch (type "sanity-publish"): fired by a Sanity webhook
#    whenever a document is published, so CMS edits go live too — see
#    site/docs/SANITY.md for the webhook setup.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]
  # Manual trigger (Actions tab → Deploy → Run workflow), for catching the
  # site up after an outage: dispatches that arrive while Actions is blocked
  # (e.g. the July 2026 quota exhaustion) are dropped, not queued.
  workflow_dispatch:

# Coalesce webhook bursts. Sanity fires one dispatch per document change, so a
# single Studio editing session can queue dozens of identical deploys back to
# back (observed: 5-6 dispatches within the same second). With a shared group,
# GitHub keeps at most one running run plus one queued run and drops the rest —
# the queued run always builds the latest content, so nothing is lost.
# cancel-in-progress stays false so an in-flight deploy is never killed
# mid-upload.
concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip a rebuild fired by a Sanity webhook for a document type that only feeds
    # the SSR Family Hub (prerender=false, read live per request) or a Studio-only
    # inbox — those never appear in the static output, so a publish shows up with
    # no build. Every full build fires dozens of Sanity reads, so a needless one
    # burns real quota (see site/docs/SANITY.md, the July 2026 exhaustion).
    #
    # This mirrors the Sanity webhook's own filter, but lives here in version
    # control too: a dashboard filter is invisible and can silently drift, so this
    # is the belt-and-suspenders enforcement point. It reads client_payload.type,
    # which the webhook projection must send (see docs/SANITY.md). Backward-safe:
    # push / workflow_dispatch (and the old typeless projection) have no
    # client_payload.type, so the list never matches and the job runs as before.
    if: >-
      ${{ !contains(fromJSON('["coopRole", "update", "hubDocument", "directoryEntry", "celebration", "hubPage", "teacherNote", "presidentNote", "signupSheet", "signupEntry", "testimonialSubmission", "submission", "hoursLog", "photoSubmission", "trashedItem"]'), github.event.client_payload.type) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # SANITY_TOKEN is read via `import.meta.env.SANITY_TOKEN` at build time
      # by src/lib/cms.ts (public-page reads) — see site/.env locally. Setting
      # it as a real env var here does the same job without a checked-in file.
      - name: Build
        run: npm run build
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}

      # Deploys with the adapter-generated config (dist/server/wrangler.json),
      # NOT the source wrangler.jsonc — see site/docs/ for why the plain
      # `wrangler deploy` 404s every sub-route on this hybrid static+SSR build.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7e75a15ddc72aae04dca71aca5c7294b
          workingDirectory: site
          command: deploy -c dist/server/wrangler.json
